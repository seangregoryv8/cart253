<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0>

  <title>Interactive Pixel Face</title>

  <!-- CSS stylesheet(s) -->
  <link rel="stylesheet" type="text/css" href="css/style.css" />

  <!-- Library script(s) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.6.0/p5.min.js"></script>
  <!-- p5.min.js is the main p5 library -->
  <script src="js/libraries/p5.min.js"></script>
  <!-- p5.sound.min.js allows us to use sound -->
  <script src="js/libraries/p5.sound.min.js"></script>

  <!-- My script(s) -->
  <script src="js/constants.js"></script>
  <script src="js/interaction.js"></script>
  <script src="js/colours.js"></script>
  <script src="js/eyes.js"></script>
  <script src="js/eyebrows.js"></script>
  <script src="js/mouth.js"></script>
  <script src="js/script.js"></script>
</head>

<style>
  canvas {
    display: block;
    margin: 0 auto;
    background-color: #ffffff;
  }
</style>

<body>
  <div style="text-align: center;">
    <h1>Interactive Pixel Face of Sean Gregory!</h1>
    <p>Click on my facial features to change my expressions!</p>
    <p>You can change my eyes, eyebrows, lips, or randomize everything by pressing SPACEBAR</p>
    <h4>See if you can make me dizzy</h4>
  </div>

  <div style="position: absolute; left: 5%; top: 10%;">
    <h1>Skin changer</h1>
    <div style="text-align: center;">
      <button onclick="skinRandomizer()">Change Skin</button>
    </div>
  </div>
  
  <div style="position: absolute; right: 5%; top: 10%;">
    <h1>Hair Changer</h1>
    <div style="text-align: center;">
      <button onclick="hairRandomizer()">Change Hair</button>
    </div>
  </div>
</body>

</html>
