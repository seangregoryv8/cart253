<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0>

  <title>BreakThrough</title>

  <!-- CSS stylesheet(s) -->
  <link rel="stylesheet" type="text/css" href="css/style.css" />

  <!-- Library script(s) -->

  <!-- p5.min.js is the main p5 library -->
  <script src="js/libraries/p5.min.js"></script>
  <!-- p5.sound.min.js allows us to use sound -->
  <script src="js/libraries/p5.sound.min.js"></script>

  <!-- My script(s) -->
  <script src="js/glitch.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/elo.js"></script>
  <script src="js/keyStrokes.js"></script>
  <script src="js/script.js"></script>
  
</head>

  <style>
    .scanlines
    {
        position: fixed;
        pointer-events: none;
        width: auto;
        min-width: 100%;
        height: 100%;
        z-index: 5;
        background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
        background-size: auto, auto;
        background-size: 100% 2px, 3px 100%;
    }
    
    .scanline
    {
        position: fixed;
        pointer-events: none;
        top: 0%;
        width: auto;
        min-width: 100%;
        height: 2px;
        z-index: 10;
        background: rgba(0, 0, 0, .3);
        opacity: 0.75;
        animation: scanline 7s linear infinite;
    }
    
    @keyframes scanline
    {
        0% { top: 99%; }
    }
    
    .flicker
    {
        pointer-events: none;
        position: fixed;
        width: auto;
        min-width: 100%;
        height: 100%;
        z-index: 15;
        background: rgba(9, 8, 8, 0.1);
        animation: flicker 0.3301s infinite;
    }
    
    @keyframes flicker
    {
        0% { opacity: 0.119; }
        5% { opacity: 0.02841; }
        10% { opacity: 0.35748; }
        15% { opacity: 0.68852; }
        20% { opacity: 0.7408; }
        25% { opacity: 0.35088; }
        30% { opacity: 0.22426; }
        35% { opacity: 0.26418; }
        40% { opacity: 0.09249; }
        45% { opacity: 0.35312; }
        50% { opacity: 0.69436; }
        55% { opacity: 0.7574; }
        60% { opacity: 0.19754; }
        65% { opacity: 0.05086; }
        70% { opacity: 0.12137; }
        75% { opacity: 0.65791; }
        80% { opacity: 0.79617; }
        85% { opacity: 0.80183; }
        90% { opacity: 0.20657; }
        95% { opacity: 0.64125; }
        100% { opacity: 0.78042; }
    }
  </style>
<body id="breakBody" style="background-color: rgb(50, 50, 50);">
  <div class="scanlines"></div>
  <div class="scanline"></div>
  <div class="flicker"></div>
  <!-- HTML would go here if needed. -->
   <img id="crt_overlay" src="assets/images/bezel.png" style="position: fixed; top: 0; left: 15%; width: 70%; height: 100%; pointer-events: none; z-index: 9999; mix-blend-mode: multiply;">
</body>

</html>
